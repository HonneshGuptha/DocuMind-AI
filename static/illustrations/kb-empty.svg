<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none" class="empty-state-svg" aria-label="Knowledge Base Empty State">
  <defs>
    <radialGradient id="kbEmptyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2B66F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E2B66F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="90" r="70" fill="url(#kbEmptyGlow)"/>

  <!-- Botanical Garden Beds / Grid Lines -->
  <g stroke="#D9DED4" stroke-width="1.2">
    <!-- Perspective Garden Grid -->
    <line x1="40" y1="140" x2="200" y2="140"/>
    <line x1="56" y1="120" x2="184" y2="120"/>
    <line x1="72" y1="100" x2="168" y2="100"/>
    <line x1="88" y1="80" x2="152" y2="80"/>

    <line x1="88" y1="80" x2="40" y2="140"/>
    <line x1="120" y1="80" x2="120" y2="140"/>
    <line x1="152" y1="80" x2="200" y2="140"/>
  </g>

  <!-- Seed Pits Awaiting SPO Triples -->
  <ellipse cx="70" cy="130" rx="6" ry="3" fill="#EAE8DE" stroke="#B9C7BB" stroke-width="1"/>
  <ellipse cx="120" cy="130" rx="6" ry="3" fill="#EAE8DE" stroke="#B9C7BB" stroke-width="1"/>
  <ellipse cx="170" cy="130" rx="6" ry="3" fill="#EAE8DE" stroke="#B9C7BB" stroke-width="1"/>

  <ellipse cx="90" cy="110" rx="5" ry="2.5" fill="#EAE8DE" stroke="#B9C7BB" stroke-width="1"/>
  <ellipse cx="150" cy="110" rx="5" ry="2.5" fill="#EAE8DE" stroke="#B9C7BB" stroke-width="1"/>

  <!-- Archie Floating above with a Sprout Seed in Hands -->
  <g transform="translate(120, 60)">
    <circle cx="0" cy="0" r="14" fill="#203B35" stroke="#315C50" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="4" fill="#E2B66F"/>
    <!-- Antenna -->
    <path d="M0 -14 C4 -22, 6 -26, 8 -30" stroke="#315C50" stroke-width="2" stroke-linecap="round"/>
    <circle cx="8" cy="-30" r="3.5" fill="#22B8CF"/>
    <!-- Document Wings -->
    <path d="M-12 -2 L-30 -10 C-32 2, -26 14, -14 18 Z" fill="#FFFEFA" stroke="#315C50" stroke-width="1.4"/>
    <path d="M12 -2 L30 -10 C32 2, 26 14, 14 18 Z" fill="#FFFEFA" stroke="#315C50" stroke-width="1.4"/>
  </g>

  <!-- Glowing Knowledge Seed falling toward ground -->
  <circle cx="120" cy="98" r="4" fill="#E2B66F" stroke="#203B35" stroke-width="1.2"/>
  <line x1="120" y1="80" x2="120" y2="92" stroke="#E2B66F" stroke-width="1.2" stroke-dasharray="2 3"/>
</svg>