<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none" class="empty-state-svg" aria-label="Documents Library Waiting for Ingestion">
  <defs>
    <radialGradient id="docEmptyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8BAE9B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8BAE9B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Atmosphere -->
  <circle cx="120" cy="90" r="70" fill="url(#docEmptyGlow)"/>

  <!-- Architectural Library Arch -->
  <path d="M50 148 L50 75 C50 36, 190 36, 190 75 L190 148" stroke="#D9DED4" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M62 148 L62 78 C62 48, 178 48, 178 78 L178 148" stroke="#EAE8DE" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Ground Botanical Ledger Shelf -->
  <line x1="30" y1="148" x2="210" y2="148" stroke="#B9C7BB" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Document Scrolls / Folio Slots -->
  <!-- Left Folio -->
  <rect x="74" y="85" width="22" height="60" rx="3" fill="#FFFEFA" stroke="#315C50" stroke-width="1.6"/>
  <line x1="80" y1="95" x2="90" y2="95" stroke="#8BAE9B" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="80" y1="103" x2="90" y2="103" stroke="#8BAE9B" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Middle Folio (Tilted) -->
  <g transform="rotate(8 110 115)">
    <rect x="100" y="80" width="22" height="64" rx="3" fill="#F3EFE5" stroke="#315C50" stroke-width="1.6"/>
    <circle cx="111" cy="92" r="3" fill="#E2B66F"/>
    <line x1="106" y1="102" x2="116" y2="102" stroke="#416F60" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- Right Folio -->
  <rect x="144" y="90" width="22" height="55" rx="3" fill="#FFFEFA" stroke="#315C50" stroke-width="1.6"/>
  <line x1="150" y1="100" x2="160" y2="100" stroke="#8BAE9B" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Botanical Sprout Growing Across Shelf -->
  <path d="M40 148 C50 142, 60 145, 68 138" stroke="#8BAE9B" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M68 138 C72 134, 76 136, 78 132" stroke="#8BAE9B" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="78" cy="132" r="2.5" fill="#E2B66F"/>

  <!-- Little Archie Silhouette Floating Overhead -->
  <circle cx="120" cy="45" r="9" fill="#203B35" stroke="#315C50" stroke-width="1.5"/>
  <circle cx="120" cy="45" r="3" fill="#E2B66F"/>
  <path d="M120 36 C124 28, 126 26, 128 22" stroke="#315C50" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="128" cy="22" r="2.5" fill="#22B8CF"/>
</svg>