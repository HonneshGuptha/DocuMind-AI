<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" class="documind-mascot mascot-unknown" aria-label="DocuMind Mascot - Unknown Open World">
  <defs>
    <radialGradient id="unkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2B66F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E2B66F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradUnk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#416F60"/>
      <stop offset="100%" stop-color="#172B2A"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="85" r="62" fill="url(#unkGlow)"/>

  <!-- Open-World Question Mark Halo -->
  <ellipse cx="80" cy="88" rx="62" ry="24" stroke="#E2B66F" stroke-width="1.8" stroke-dasharray="5 5" transform="rotate(-15 80 88)"/>

  <!-- Floating Question Mark Glyph Node -->
  <g transform="translate(118, 38)">
    <circle cx="10" cy="10" r="10" fill="#FFF2D8" stroke="#8A5A16" stroke-width="1.8"/>
    <text x="10" y="14" font-size="12" font-family="sans-serif" font-weight="900" fill="#8A5A16" text-anchor="middle">?</text>
  </g>

  <!-- Puzzled / Tilted Antenna -->
  <path d="M78 48 C68 34, 76 22, 68 12" stroke="#315C50" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="68" cy="12" r="5.5" fill="#E2B66F" stroke="#203B35" stroke-width="1.8"/>

  <!-- Shrugging Wings -->
  <g class="mascot-wing-left">
    <path d="M70 70 L28 66 C28 84, 38 102, 54 112 L70 94 Z" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>
  </g>
  <g class="mascot-wing-right">
    <path d="M88 68 L130 52 C134 70, 126 92, 110 106 L90 92 Z" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>
  </g>

  <!-- Central Knowledge Seed Body (Subtle curious 5deg tilt) -->
  <g transform="rotate(4 80 88)">
    <path d="M80 48 C98 48, 108 66, 106 88 C104 110, 92 124, 80 126 C68 124, 56 110, 54 88 C52 66, 62 48, 80 48 Z" fill="url(#bodyGradUnk)" stroke="#172B2A" stroke-width="2.2"/>

    <!-- Curious Asymmetric Visor Eyes -->
    <rect x="66" y="74" width="28" height="14" rx="7" fill="#142421" stroke="#8A5A16" stroke-width="1.2"/>
    <circle cx="74" cy="81" r="3.2" fill="#22B8CF"/>
    <circle cx="86" cy="80" r="2" fill="#22B8CF"/>

    <!-- Open World Assumption Inscription (OWA) -->
    <rect x="71" y="98" width="18" height="12" rx="3" fill="#FFF2D8" stroke="#8A5A16" stroke-width="1"/>
    <text x="80" y="107" font-size="6.5" font-family="monospace" font-weight="800" fill="#8A5A16" text-anchor="middle">OWA</text>
  </g>
</svg>