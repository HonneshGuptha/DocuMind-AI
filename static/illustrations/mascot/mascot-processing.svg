<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" class="documind-mascot mascot-processing" aria-label="DocuMind Mascot - Extracting Facts">
  <defs>
    <radialGradient id="procGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8BAE9B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8BAE9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradProc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#315C50"/>
      <stop offset="100%" stop-color="#172B2A"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="85" r="64" fill="url(#procGlow)"/>

  <!-- Rotating Orbital Fact Extraction Rings -->
  <ellipse cx="80" cy="88" rx="66" ry="26" stroke="#8BAE9B" stroke-width="1.6" stroke-dasharray="6 4" transform="rotate(-18 80 88)"/>
  <ellipse cx="80" cy="88" rx="58" ry="32" stroke="#E2B66F" stroke-width="1.4" stroke-dasharray="4 4" transform="rotate(28 80 88)"/>

  <!-- Orbiting SPO Nodes -->
  <!-- Subject Node (Parchment) -->
  <g transform="translate(24, 76)">
    <circle cx="8" cy="8" r="8" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>
    <text x="8" y="11" font-size="8" font-family="sans-serif" font-weight="800" fill="#203B35" text-anchor="middle">S</text>
  </g>

  <!-- Predicate Node (Connecting Leaf) -->
  <g transform="translate(118, 56)">
    <circle cx="8" cy="8" r="8" fill="#8BAE9B" stroke="#203B35" stroke-width="1.8"/>
    <text x="8" y="11" font-size="8" font-family="sans-serif" font-weight="800" fill="#172B2A" text-anchor="middle">P</text>
  </g>

  <!-- Object Node (Golden Orb) -->
  <g transform="translate(104, 114)">
    <circle cx="8" cy="8" r="8" fill="#E2B66F" stroke="#203B35" stroke-width="1.8"/>
    <text x="8" y="11" font-size="8" font-family="sans-serif" font-weight="800" fill="#172B2A" text-anchor="middle">O</text>
  </g>

  <!-- Antenna -->
  <path d="M80 48 C78 30, 94 22, 98 12" stroke="#315C50" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="98" cy="12" r="6" fill="#E2B66F" stroke="#203B35" stroke-width="1.8"/>

  <!-- Wings Fluttering Rapidly -->
  <path d="M72 68 L28 54 C24 72, 34 94, 52 108 L70 92 Z" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>
  <path d="M88 68 L132 54 C136 72, 126 94, 108 108 L90 92 Z" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>

  <!-- Central Knowledge Seed Body -->
  <path d="M80 48 C98 48, 108 66, 106 88 C104 110, 92 124, 80 126 C68 124, 56 110, 54 88 C52 66, 62 48, 80 48 Z" fill="url(#bodyGradProc)" stroke="#172B2A" stroke-width="2.2"/>

  <!-- Processing Visor (Active Cycling Bars) -->
  <rect x="66" y="74" width="28" height="14" rx="7" fill="#142421" stroke="#315C50" stroke-width="1.2"/>
  <rect x="71" y="78" width="4" height="6" rx="1" fill="#22B8CF"/>
  <rect x="78" y="77" width="4" height="8" rx="1" fill="#8BAE9B"/>
  <rect x="85" y="79" width="4" height="4" rx="1" fill="#E2B66F"/>

  <!-- Pulsing Center Reactor -->
  <circle cx="80" cy="104" r="6" fill="#8BAE9B" stroke="#172B2A" stroke-width="1.5"/>
  <circle cx="80" cy="104" r="2.5" fill="#FFFFFF"/>
</svg>