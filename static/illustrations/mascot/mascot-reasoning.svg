<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" class="documind-mascot mascot-reasoning" aria-label="DocuMind Mascot - Symbolic Reasoning Engine">
  <defs>
    <radialGradient id="reasonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B7CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradReason" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#315C50"/>
      <stop offset="100%" stop-color="#142421"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="85" r="66" fill="url(#reasonGlow)"/>

  <!-- Geometric Deductive Constellation Network -->
  <!-- Premise 1 (Left Node) -->
  <circle cx="26" cy="46" r="6" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>
  <text x="26" y="49" font-size="7" font-family="monospace" font-weight="700" fill="#203B35" text-anchor="middle">P1</text>

  <!-- Premise 2 (Right Node) -->
  <circle cx="134" cy="46" r="6" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>
  <text x="134" y="49" font-size="7" font-family="monospace" font-weight="700" fill="#203B35" text-anchor="middle">P2</text>

  <!-- Intermediate Unification Node (Top) -->
  <circle cx="80" cy="18" r="7" fill="#E2B66F" stroke="#203B35" stroke-width="2"/>
  <text x="80" y="21" font-size="8" font-family="monospace" font-weight="800" fill="#172B2A" text-anchor="middle">R1</text>

  <!-- Constellation Connecting Lines -->
  <line x1="32" y1="44" x2="74" y2="22" stroke="#8B7CF6" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="128" y1="44" x2="86" y2="22" stroke="#8B7CF6" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="30" y1="52" x2="72" y2="90" stroke="#5369D8" stroke-width="1.6"/>
  <line x1="130" y1="52" x2="88" y2="90" stroke="#5369D8" stroke-width="1.6"/>
  <line x1="80" y1="26" x2="80" y2="60" stroke="#E2B66F" stroke-width="2"/>

  <!-- Antenna with Violet Pulsing Core -->
  <path d="M80 48 L80 26" stroke="#203B35" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wings Spread in Formal Symmetry -->
  <g class="mascot-wing-left">
    <path d="M72 68 L28 62 C26 80, 36 100, 54 112 L70 94 Z" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>
    <line x1="38" y1="74" x2="56" y2="82" stroke="#8B7CF6" stroke-width="1.2"/>
  </g>
  <g class="mascot-wing-right">
    <path d="M88 68 L132 62 C134 80, 124 100, 106 112 L90 94 Z" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>
    <line x1="122" y1="74" x2="104" y2="82" stroke="#8B7CF6" stroke-width="1.2"/>
  </g>

  <!-- Central Knowledge Seed Body -->
  <path d="M80 48 C98 48, 108 66, 106 88 C104 110, 92 124, 80 126 C68 124, 56 110, 54 88 C52 66, 62 48, 80 48 Z" fill="url(#bodyGradReason)" stroke="#172B2A" stroke-width="2.2"/>

  <!-- Analytical Visor -->
  <rect x="66" y="74" width="28" height="14" rx="7" fill="#142421" stroke="#8B7CF6" stroke-width="1.4"/>
  <line x1="71" y1="81" x2="77" y2="81" stroke="#8B7CF6" stroke-width="2" stroke-linecap="round"/>
  <line x1="83" y1="81" x2="89" y2="81" stroke="#8B7CF6" stroke-width="2" stroke-linecap="round"/>

  <!-- Fired Horn-Clause Modus Ponens Glyph on Chest -->
  <polygon points="80,96 86,106 74,106" fill="#E2B66F" stroke="#172B2A" stroke-width="1.2"/>
  <circle cx="80" cy="115" r="3.5" fill="#22B8CF"/>
</svg>