<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" class="documind-mascot mascot-reset" aria-label="DocuMind Mascot - Workspace Fresh Start">
  <defs>
    <radialGradient id="resetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8BAE9B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8BAE9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradReset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#315C50"/>
      <stop offset="100%" stop-color="#172B2A"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="95" r="56" fill="url(#resetGlow)"/>

  <!-- Fresh Garden Ground Soil Bed -->
  <path d="M24 136 C50 128, 110 128, 136 136" stroke="#8BAE9B" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="80" cy="138" rx="44" ry="10" fill="#EAE8DE" stroke="#B8CCBF" stroke-width="1.2"/>

  <!-- Tiny Sprout emerging from soil -->
  <path d="M38 132 C36 124, 42 120, 46 122 C48 126, 44 130, 40 134" fill="#8BAE9B"/>
  <path d="M122 132 C124 124, 118 120, 114 122 C112 126, 116 130, 120 134" fill="#8BAE9B"/>

  <!-- Resting Antenna with glowing dormant bead -->
  <path d="M80 58 C84 46, 78 38, 76 30" stroke="#315C50" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="76" cy="30" r="5" fill="#E2B66F" stroke="#172B2A" stroke-width="1.5"/>

  <!-- Wings folded in rest like a cocoon -->
  <path d="M72 74 C50 80, 44 104, 60 122 L72 102 Z" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>
  <path d="M88 74 C110 80, 116 104, 100 122 L88 102 Z" fill="#FFFEFA" stroke="#315C50" stroke-width="1.8"/>

  <!-- Resting Seed Body nestled in soil -->
  <path d="M80 56 C96 56, 106 72, 104 94 C102 114, 92 126, 80 128 C68 126, 58 114, 56 94 C54 72, 64 56, 80 56 Z" fill="url(#bodyGradReset)" stroke="#172B2A" stroke-width="2.2"/>

  <!-- Peaceful Resting Visor Eyes (horizontal slit / smile) -->
  <rect x="66" y="80" width="28" height="13" rx="6.5" fill="#142421" stroke="#315C50" stroke-width="1.2"/>
  <path d="M71 86 Q74 88 77 86" stroke="#8BAE9B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M83 86 Q86 88 89 86" stroke="#8BAE9B" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Gentle Awakening Heartbeat Spark -->
  <circle cx="80" cy="106" r="4" fill="#E2B66F" stroke="#172B2A" stroke-width="1.2"/>
</svg>