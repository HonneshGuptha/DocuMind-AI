<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" class="documind-mascot mascot-idle" aria-label="DocuMind Mascot - Idle">
  <defs>
    <radialGradient id="idleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2B66F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E2B66F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#315C50"/>
      <stop offset="100%" stop-color="#172B2A"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFEFA"/>
      <stop offset="100%" stop-color="#EAE8DE"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E5C8"/>
      <stop offset="100%" stop-color="#E2B66F"/>
    </linearGradient>
  </defs>

  <!-- Ambient Aura -->
  <circle cx="80" cy="88" r="62" fill="url(#idleGlow)" class="mascot-aura"/>

  <!-- Botanical Sprout Antenna -->
  <path d="M80 50 C80 34, 96 28, 98 18" stroke="#315C50" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="98" cy="18" r="6" fill="url(#goldGrad)" stroke="#203B35" stroke-width="1.8" class="mascot-sparkle"/>
  <path d="M86 38 C94 36, 102 42, 104 46" stroke="#8BAE9B" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Left Layered Document Wing -->
  <g class="mascot-wing-left">
    <path d="M72 70 L34 58 C30 76, 36 96, 52 110 L70 94 Z" fill="url(#wingGrad)" stroke="#315C50" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="42" y1="72" x2="60" y2="80" stroke="#B8CCBF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="46" y1="84" x2="62" y2="92" stroke="#B8CCBF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Right Layered Document Wing -->
  <g class="mascot-wing-right">
    <path d="M88 70 L126 58 C130 76, 124 96, 108 110 L90 94 Z" fill="url(#wingGrad)" stroke="#315C50" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="118" y1="72" x2="100" y2="80" stroke="#B8CCBF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="114" y1="84" x2="98" y2="92" stroke="#B8CCBF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Central Knowledge Seed Body -->
  <path d="M80 50 C98 50, 108 68, 106 90 C104 112, 92 126, 80 128 C68 126, 56 112, 54 90 C52 68, 62 50, 80 50 Z" fill="url(#bodyGrad)" stroke="#172B2A" stroke-width="2.2"/>

  <!-- Seed Texture Grooves -->
  <path d="M80 54 Q72 88 80 124" stroke="#416F60" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M80 54 Q88 88 80 124" stroke="#416F60" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Obsidian Visor Screen -->
  <rect x="66" y="74" width="28" height="14" rx="7" fill="#142421" stroke="#315C50" stroke-width="1.2"/>

  <!-- Observant Intelligent Eyes -->
  <circle cx="74" cy="81" r="2.5" fill="#22B8CF" class="mascot-eye"/>
  <circle cx="86" cy="81" r="2.5" fill="#22B8CF" class="mascot-eye"/>

  <!-- Core Knowledge Spark (Center Node) -->
  <circle cx="80" cy="104" r="5" fill="url(#goldGrad)" stroke="#172B2A" stroke-width="1.4"/>
  <circle cx="80" cy="104" r="2" fill="#FFFFFF"/>

  <!-- Little Orbital Particle Beads -->
  <circle cx="48" cy="46" r="2.5" fill="#22B8CF" opacity="0.85"/>
  <circle cx="116" cy="44" r="2.5" fill="#E2B66F" opacity="0.85"/>
  <circle cx="80" cy="142" r="3" fill="#8BAE9B" opacity="0.7"/>
</svg>