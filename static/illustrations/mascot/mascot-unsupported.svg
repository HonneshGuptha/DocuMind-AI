<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" class="documind-mascot mascot-unsupported" aria-label="DocuMind Mascot - Unsupported Scope">
  <defs>
    <radialGradient id="unsuppGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A34C3D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A34C3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradUnsupp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#315C50"/>
      <stop offset="100%" stop-color="#172B2A"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="85" r="62" fill="url(#unsuppGlow)"/>

  <!-- Protective Scope Boundary Line -->
  <circle cx="80" cy="88" r="64" stroke="#E9C1B7" stroke-width="1.8" stroke-dasharray="4 6"/>

  <!-- Antenna Standing Straight & Formal -->
  <path d="M80 48 L80 18" stroke="#315C50" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="80,12 85,22 75,22" fill="#A34C3D" stroke="#172B2A" stroke-width="1.5"/>

  <!-- Central Knowledge Seed Body -->
  <path d="M80 48 C98 48, 108 66, 106 88 C104 110, 92 124, 80 126 C68 124, 56 110, 54 88 C52 66, 62 48, 80 48 Z" fill="url(#bodyGradUnsupp)" stroke="#172B2A" stroke-width="2.2"/>

  <!-- Wings Folded Inward as a Shield (Crossing in Front) -->
  <path d="M74 66 L50 82 C50 102, 64 116, 78 122 L76 96 Z" fill="#FFFEFA" stroke="#A34C3D" stroke-width="1.8"/>
  <path d="M86 66 L110 82 C110 102, 96 116, 82 122 L84 96 Z" fill="#F3EFE5" stroke="#A34C3D" stroke-width="1.8"/>

  <!-- Serious Straight Visor Eyes (Safety Guard) -->
  <rect x="66" y="74" width="28" height="14" rx="7" fill="#142421" stroke="#A34C3D" stroke-width="1.4"/>
  <line x1="71" y1="81" x2="77" y2="81" stroke="#E6A08B" stroke-width="2" stroke-linecap="round"/>
  <line x1="83" y1="81" x2="89" y2="81" stroke="#E6A08B" stroke-width="2" stroke-linecap="round"/>

  <!-- Scope Guard Badge -->
  <circle cx="80" cy="106" r="8" fill="#FBEAE5" stroke="#A34C3D" stroke-width="1.6"/>
  <line x1="75" y1="106" x2="85" y2="106" stroke="#A34C3D" stroke-width="2" stroke-linecap="round"/>
</svg>