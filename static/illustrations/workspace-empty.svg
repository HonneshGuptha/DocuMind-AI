  <circle cx="120" cy="88" r="6" fill="#E2B66F" stroke="#203B35" stroke-width="1.6"/>
  <circle cx="120" cy="88" r="2" fill="#FFFFFF"/>

  <!-- Gentle Golden Sun Rays / Clean Slate Aura -->
  <line x1="120" y1="64" x2="120" y2="52" stroke="#E2B66F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="98" y1="72" x2="88" y2="64" stroke="#E2B66F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="142" y1="72" x2="152" y2="64" stroke="#E2B66F" stroke-width="1.5" stroke-linecap="round"/>
</svg>