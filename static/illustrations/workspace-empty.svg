<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none" class="empty-state-svg" aria-label="Fresh Workspace Ready for Cultivation">
  <defs>
    <radialGradient id="freshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8BAE9B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8BAE9B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="90" r="70" fill="url(#freshGlow)"/>

  <!-- Morning Mist over Garden Ground -->
  <path d="M40 135 C70 125, 170 125, 200 135" stroke="#8BAE9B" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="120" cy="142" rx="72" ry="12" fill="#EAE8DE" stroke="#D9DED4" stroke-width="1.2"/>

  <!-- Botanical Seed Sprout Germinating in Sunlight -->
  <!-- Left Leaf -->
  <path d="M120 132 C104 122, 102 108, 114 102 C120 110, 120 122, 120 132 Z" fill="#8BAE9B" stroke="#315C50" stroke-width="1.4"/>
  <!-- Right Leaf -->
  <path d="M120 132 C136 122, 138 108, 126 102 C120 110, 120 122, 120 132 Z" fill="#8BAE9B" stroke="#315C50" stroke-width="1.4"/>
  <!-- Central Golden Stem & Node -->
